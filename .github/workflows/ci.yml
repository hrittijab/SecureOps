
name: SecureOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pip install "pandas>=2.2,<3"

      - name: Run Python tests
        run: python -m pytest -q

  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: secureops_auth
          POSTGRES_USER: secureops
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U secureops -d secureops_auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/auth-service

    env:
      DB_URL: jdbc:postgresql://localhost:5433/secureops_auth
      DB_USERNAME: secureops
      DB_PASSWORD: ci_test_password
      JWT_PRIVATE_KEY: ${{ github.workspace }}/secrets/jwt-private.pem
      JWT_PUBLIC_KEY: ${{ github.workspace }}/secrets/jwt-public.pem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/auth-service/pom.xml

      - name: Generate temporary JWT keys
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out secrets/jwt-private.pem
          openssl pkey -in secrets/jwt-private.pem -pubout -out secrets/jwt-public.pem

      - name: Run Maven verification
        run: mvn -B verify

  publish-image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    needs:
      - python-tests
      - java-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify publishing identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Actor: $GITHUB_ACTOR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish authentication service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secureops-auth:latest
            ghcr.io/${{ github.repository_owner }}/secureops-auth:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SecureOps authentication service

  deploy-dashboard:
    name: Deploy Streamlit Dashboard
    runs-on: ubuntu-latest

    needs:
      - publish-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update deployment branch
        run: |
          git fetch origin deploy
          git push origin HEAD:deploy
