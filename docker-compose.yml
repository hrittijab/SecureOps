services:

  auth-db:
    image: postgres:17
    container_name: secureops-auth-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secureops_auth}
      POSTGRES_USER: ${POSTGRES_USER:-secureops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureops} -d ${POSTGRES_DB:-secureops_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5
  user-db:
    image: postgres:17
    container_name: secureops-user-db
    environment:
      POSTGRES_DB: secureops_user
      POSTGRES_USER: secureops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureops -d secureops_user"]
      interval: 5s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:3.9.1
    container_name: secureops-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  auth-db-data:
  user-db-data:

  kafka-data:
