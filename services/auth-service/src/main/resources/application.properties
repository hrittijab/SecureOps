spring.application.name=auth-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/secureops_auth}
spring.datasource.username=${DB_USERNAME:secureops}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
secureops.jwt.private-key=${JWT_PRIVATE_KEY}
secureops.jwt.public-key=${JWT_PUBLIC_KEY}
# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Outbox publisher
secureops.outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
secureops.outbox.publisher.fixed-delay-ms=5000

# Kafka producer reliability
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.retries=3
